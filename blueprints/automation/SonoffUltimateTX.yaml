blueprint:
  name: Sonoff TX Ultimate – slide and two-finger gestures
  # One line per paragraph: Home Assistant shows every line break in the description.
  description: |
    Five extra gestures for the **SONOFF TX Ultimate (T5)** touch wall switch: **slide left**, **slide right**, **two-finger double tap** and **two-finger tap followed by a slide** to the left or to the right.

    **Before you start**
    - The [SonoffLAN](https://github.com/AlexxIT/SonoffLAN) integration (HACS) must run in mode **auto**. In mode *local* the slides never arrive and the double tap is too slow.
    - Create a **Text helper** for every switch (*Settings → Devices & services → Helpers → Create helper → Text*). It remembers the last gesture.

    Only physical touches count. The app, dashboards, automations, scripts and scenes can't trigger a gesture.

    [Documentation and changelog](https://github.com/tavarez992/HomeassistantBlueprints#sonoff-tx-ultimate)
  domain: automation
  author: Shadala
  source_url: https://github.com/tavarez992/HomeassistantBlueprints/blob/main/blueprints/automation/SonoffUltimateTX.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    switch_section:
      name: Switch
      icon: mdi:light-switch
      description: >-
        Entities of your TX Ultimate from the SonoffLAN integration and the Text helper that
        remembers the last gesture.
      input:
        controller_ambient:
          name: Ambient light
          description: >-
            The LED ambient light of the switch, e.g. `light.sonoff_10012345ab`. A two-finger tap
            toggles it, that is how the blueprint notices the tap.
          selector:
            entity:
              filter:
                - integration: sonoff
                  domain: light
        controller_entity:
          name: Slide sensor
          description: >-
            The action sensor of the switch, e.g. `sensor.sonoff_10012345ab_action`. It reports
            `slide_1` for a slide to the left and `slide_2` for a slide to the right.
          selector:
            entity:
              filter:
                - integration: sonoff
                  domain: sensor
        helper_last_controller_event:
          name: Last gesture helper
          description: >-
            Text helper (`input_text`) that stores the last gesture and its time. Use a separate
            helper for every switch, the default settings (maximum length 100) are enough.
          selector:
            entity:
              filter:
                - domain: input_text
    slide_section:
      name: Slide
      icon: mdi:gesture-swipe-horizontal
      description: One finger across the switch. The action runs right away.
      input:
        action_single_actions_slide_1:
          name: Slide left
          description: One-finger slide to the left.
          default: []
          selector:
            action: {}
        action_single_actions_slide_2:
          name: Slide right
          description: One-finger slide to the right.
          default: []
          selector:
            action: {}
    two_finger_section:
      name: Two-finger gestures
      icon: mdi:gesture-two-double-tap
      description: >-
        Start with a two-finger tap (it toggles the ambient light), then tap again or slide within
        the double-tap window. After a tap and slide the blueprint switches the ambient light back.
      input:
        action_double_actions_double_ambient_click:
          name: Two-finger double tap
          description: Two quick taps with two fingers.
          default: []
          selector:
            action: {}
        action_double_actions_slide_1:
          name: Two-finger tap, then slide left
          description: Tap with two fingers, then slide to the left.
          default: []
          selector:
            action: {}
        action_double_actions_slide_2:
          name: Two-finger tap, then slide right
          description: Tap with two fingers, then slide to the right.
          default: []
          selector:
            action: {}
    timing_section:
      name: Timing
      icon: mdi:timer-cog-outline
      collapsed: true
      input:
        helper_double_press_delay:
          name: Double-tap window
          description: >-
            Longest gap between the two-finger tap and the second tap or the slide. With SonoffLAN
            in mode auto the gaps are 150–550 ms, so the default 1 second is enough. Raise it only
            if the automation trace shows a longer `trigger_delta`.
          default: 1000
          selector:
            number:
              min: 100
              max: 5000
              step: 10
              unit_of_measurement: milliseconds
              mode: box

# A new touch cancels the previous run. Long-running scripts in your actions should be started
# with script.turn_on, otherwise the next gesture stops them.
mode: restart
max_exceeded: silent

triggers:
  # State changes only: attribute updates and returns from unavailable are not touches.
  - trigger: state
    entity_id: !input controller_ambient
    not_from:
      - unavailable
      - unknown
    not_to:
      - unavailable
      - unknown
  - trigger: state
    entity_id: !input controller_entity
    to: slide_1
  - trigger: state
    entity_id: !input controller_entity
    to: slide_2

conditions:
  - alias: Only physical touches on the switch
    condition: template
    value_template: |-
      {#- A touch on the switch is a state change without a parent context and without a user that
          no automation or script caused. Automations started by MQTT or by time have no parent
          context either, so the context is also compared with the last run of every automation
          and script (otherwise a scene that flashes the ambient light looks like a double tap). -#}
      {%- set ctx = trigger.to_state.context -%}
      {%- set from_ha = (states.automation | selectattr('context.id', 'eq', ctx.id) | list | count)
                      + (states.script | selectattr('context.id', 'eq', ctx.id) | list | count) > 0 -%}
      {{ trigger.to_state.state in ['on', 'off', 'slide_1', 'slide_2']
         and ctx.parent_id is none and ctx.user_id is none and not from_ha }}

actions:
  - variables:
      helper_last_controller_event: !input helper_last_controller_event
      helper_double_press_delay: !input helper_double_press_delay
      trigger_action: "{{ trigger.to_state.state }}"
      # The helper holds {"a": <last event>, "t": <timestamp>}.
      trigger_delta: >-
        {{ (as_timestamp(now()) - ((states(helper_last_controller_event) | from_json).t
        if helper_last_controller_event is not none
        and (states(helper_last_controller_event) | regex_match("^\{((\"a\":\".*\"|\"t\":\d+\.\d+)(,)?){2}\}$"))
        else as_timestamp("1970-01-01 00:00:00"))) * 1000 }}
      last_controller_event: >-
        {{ (states(helper_last_controller_event) | from_json).a
        if helper_last_controller_event is not none
        and (states(helper_last_controller_event) | regex_match("^\{((\"a\":\".*\"|\"t\":\d+\.\d+)(,)?){2}\}$"))
        else "" }}
      time_to_do_double: >-
        {{ trigger_delta | int <= helper_double_press_delay | int
        and last_controller_event in ['on', 'off'] }}
  - alias: Remember this event
    action: input_text.set_value
    target:
      entity_id: !input helper_last_controller_event
    data:
      value: "{{ {'a': trigger_action, 't': as_timestamp(now())} | to_json }}"
  - if:
      - condition: template
        value_template: "{{ time_to_do_double }}"
    then:
      - alias: Two-finger gestures
        choose:
          - alias: Two-finger tap, then slide left
            conditions:
              - condition: template
                value_template: "{{ trigger_action == 'slide_1' }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: !input helper_last_controller_event
                data:
                  value: "{{ {'a': 'do_second_left', 't': as_timestamp(now())} | to_json }}"
              - choose:
                  - conditions: []
                    sequence: !input action_double_actions_slide_1
              - alias: Switch the ambient light back
                action: light.toggle
                target:
                  entity_id: !input controller_ambient
          - alias: Two-finger tap, then slide right
            conditions:
              - condition: template
                value_template: "{{ trigger_action == 'slide_2' }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: !input helper_last_controller_event
                data:
                  value: "{{ {'a': 'do_second_right', 't': as_timestamp(now())} | to_json }}"
              - choose:
                  - conditions: []
                    sequence: !input action_double_actions_slide_2
              - alias: Switch the ambient light back
                action: light.toggle
                target:
                  entity_id: !input controller_ambient
          - alias: Two-finger double tap
            conditions:
              - condition: template
                value_template: "{{ trigger_action in ['on', 'off'] }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: !input helper_last_controller_event
                data:
                  value: "{{ {'a': 'double_ambient_click', 't': as_timestamp(now())} | to_json }}"
              - choose:
                  - conditions: []
                    sequence: !input action_double_actions_double_ambient_click
    else:
      - alias: Slide
        choose:
          - alias: Slide left
            conditions:
              - condition: template
                value_template: "{{ trigger_action == 'slide_1' }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: !input helper_last_controller_event
                data:
                  value: "{{ {'a': 'do_single_left', 't': as_timestamp(now())} | to_json }}"
              - choose:
                  - conditions: []
                    sequence: !input action_single_actions_slide_1
          - alias: Slide right
            conditions:
              - condition: template
                value_template: "{{ trigger_action == 'slide_2' }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: !input helper_last_controller_event
                data:
                  value: "{{ {'a': 'do_single_right', 't': as_timestamp(now())} | to_json }}"
              - choose:
                  - conditions: []
                    sequence: !input action_single_actions_slide_2
